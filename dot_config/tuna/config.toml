[settings]
comboModeDoublePressTrigger = 'leftCommand'
comboModeTriggerType = 'doublePress'
dictationActivationMode = 'toggle'
dictationWindowPosition = 'bottomCenter'
resultListNavigationBindings = 'vimStyle'
