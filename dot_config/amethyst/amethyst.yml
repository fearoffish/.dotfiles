# Amethyst configuration.
#
# Amethyst reads this file at ~/.config/amethyst/amethyst.yml (it also still
# honours the legacy ~/.amethyst.yml). On launch it will warn that a config
# file "can override in-app preferences" — that is expected, and is the point:
# this file is the source of truth, not the Settings window. Change things
# here and relaunch (⌃⌥⇧Z) rather than clicking around in Settings, or the two
# will disagree.
#
# Every key Amethyst understands is spelled out, including the ones left at
# their shipped values, so an upstream default change can never quietly move
# the setup underneath us. The shipped values live in
# /Applications/Amethyst.app/Contents/Resources/default.amethyst — diff
# against that after an Amethyst upgrade to spot new keys.
#
# Only three values differ from stock; each is marked "changed" below.

# Layout cycle order, as visited by cycle-layout.
layouts:
  - tall
  - wide
  - fullscreen
  - column

# The two modifier sets every binding below refers to. AeroSpace used bare
# alt; option+shift keeps the same hand shape without colliding with macOS
# text navigation, and leaves ctrl+alt free for herdr.
mod1: [option, shift]           # ⌥⇧
mod2: [option, shift, control]  # ⌃⌥⇧

# Layout selection. asdf sits under the left hand in cycle order.
select-tall-layout:       {mod: mod1, key: a}
select-wide-layout:       {mod: mod1, key: s}
select-fullscreen-layout: {mod: mod1, key: d}
select-column-layout:     {mod: mod1, key: f}
cycle-layout:             {mod: mod1, key: space}
cycle-layout-backward:    {mod: mod2, key: space}
display-current-layout:   {mod: mod1, key: i}

# Focus and swap within a space. hjkl-adjacent, so the AeroSpace muscle
# memory survives: mod1 moves focus, mod2 moves the window.
focus-ccw:  {mod: mod1, key: j}
focus-cw:   {mod: mod1, key: k}
focus-main: {mod: mod1, key: m}
swap-ccw:   {mod: mod2, key: j}
swap-cw:    {mod: mod2, key: k}
swap-main:  {mod: mod1, key: enter}

# Main pane sizing. h/l resize it, comma/full stop change how many windows
# it holds.
shrink-main:   {mod: mod1, key: h}
expand-main:   {mod: mod1, key: l}
increase-main: {mod: mod1, key: ','}
decrease-main: {mod: mod1, key: '.'}

# Screens. mod1 focuses, mod2 throws the window there.
focus-screen-1:   {mod: mod1, key: w}
focus-screen-2:   {mod: mod1, key: e}
focus-screen-3:   {mod: mod1, key: r}
focus-screen-4:   {mod: mod1, key: q}
focus-screen-5:   {mod: mod1, key: g}
focus-screen-ccw: {mod: mod1, key: p}
focus-screen-cw:  {mod: mod1, key: n}
throw-screen-1:   {mod: mod2, key: w}
throw-screen-2:   {mod: mod2, key: e}
throw-screen-3:   {mod: mod2, key: r}
throw-screen-4:   {mod: mod2, key: q}
throw-screen-5:   {mod: mod2, key: g}
swap-screen-ccw:  {mod: mod2, key: h}
swap-screen-cw:   {mod: mod2, key: l}

# Spaces. Amethyst can only throw a window to a space, never focus one, so
# focusing stays on macOS's own ⌃1..⌃9. These indices are why
# amethyst-defaults.sh turns off mru-spaces.
throw-space-1:     {mod: mod2, key: '1'}
throw-space-2:     {mod: mod2, key: '2'}
throw-space-3:     {mod: mod2, key: '3'}
throw-space-4:     {mod: mod2, key: '4'}
throw-space-5:     {mod: mod2, key: '5'}
throw-space-6:     {mod: mod2, key: '6'}
throw-space-7:     {mod: mod2, key: '7'}
throw-space-8:     {mod: mod2, key: '8'}
throw-space-9:     {mod: mod2, key: '9'}
throw-space-10:    {mod: mod2, key: '0'}
throw-space-left:  {mod: mod2, key: left}
throw-space-right: {mod: mod2, key: right}

# Tiling toggles and maintenance. enable-tiling and disable-tiling are the
# one-way versions of toggle-tiling; false leaves them unbound.
toggle-float:               {mod: mod1, key: t}
toggle-tiling:              {mod: mod2, key: t}
toggle-focus-follows-mouse: {mod: mod2, key: x}
reevaluate-windows:         {mod: mod1, key: z}
relaunch-amethyst:          {mod: mod2, key: z}
enable-tiling: false
disable-tiling: false

# Windows that never tile. floating-is-blacklist means this list is the set
# that floats, rather than the only set that tiles. System Settings is here
# because it wants its own size; the old AeroSpace config floated Finder,
# Preview, QuickTime and Tuna too, so add them back the same way if they
# turn out to be annoying. window-titles narrows a rule to named windows;
# empty means the whole app.
floating:                                 # changed
  - id: com.apple.systempreferences
    window-titles: []
floating-is-blacklist: true

# Dialogues and pickers are usually small, so float them automatically
# rather than listing every app above.
float-small-windows: true
small-window-size: 500

# Gaps. margin-size is applied per window edge, so neighbouring windows end
# up 8pt apart, matching the gaps AeroSpace was set to.
window-margins: true                      # changed
window-margin-size: 4                     # changed
screen-padding-top: 0
screen-padding-bottom: 0
screen-padding-left: 0
screen-padding-right: 0
ignore-menu-bar: false

# Focus behaviour. focus-follows-mouse is off; ⌃⌥⇧X toggles it for the
# occasional session where it helps.
focus-follows-mouse: false
mouse-follows-focus: false
new-windows-to-main: false
follow-space-thrown-windows: true

# Window constraints. Zero means unconstrained.
window-max-count: 0
window-minimum-height: 0
window-minimum-width: 0
window-resize-step: 5

# The layout HUD that names the current layout on switch.
enables-layout-hud: true
enables-layout-hud-on-space-change: true
enables-window-count-hud: false
debug-layout-info: false

restore-layouts-on-launch: true
use-canary-build: false
