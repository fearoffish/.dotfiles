[[snippets]]
trigger = ":date"
replace = "{{date}}"
description = "Current date"

[[snippets]]
trigger = ":time"
replace = "{{time}}"
description = "Current time"

[[snippets]]
trigger = ":clip"
replace = "{{clipboard}}"
description = "Paste current clipboard text"

[[snippets]]
trigger = ":sig"
replace = "Cheers,\nJamie{{cursor}}"
description = "Signature snippet with cursor placement"

[[snippets]]
trigger = ":bi"
replace = "op run --env-file=.env.development -- bundle install"
description = "Run bundle install with 1Password cli"

[[snippets]]
trigger = ":def"
replace = "def {{prompt:Method name}}\n  echo \"{{prompt:Echo what\"}}\nend"
description = "Create an echo method"
